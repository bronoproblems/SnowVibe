[package]
name = "snowvibe"
version = "1.0.0"
edition = "2021"
description = "Interactive desktop snow for Windows 10 and 11"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi"
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

